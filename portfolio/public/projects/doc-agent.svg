<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="DOC-AGENT — LangGraph research agent diagram">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111" stroke-width="0.5" opacity="0.18"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5b1f"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="540" fill="#f4f1ea"/>
  <rect width="1200" height="540" fill="url(#grid)"/>
  <rect x="6" y="6" width="1188" height="528" fill="none" stroke="#111" stroke-width="3"/>

  <!-- title bar -->
  <g font-family="'JetBrains Mono', monospace" font-weight="700">
    <rect x="20" y="20" width="1160" height="46" fill="#111"/>
    <text x="36" y="51" font-size="16" fill="#f4f1ea" letter-spacing="2">LangGraph  //  DOC-AGENT  //  STATE MACHINE  v1.4  //  STATUS: ● LIVE</text>
    <text x="1160" y="51" font-size="12" fill="#ff5b1f" text-anchor="end" letter-spacing="1.5">RUN 19,234  ·  ACC 0.91</text>
  </g>

  <!-- column labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#111" letter-spacing="1.5">
    <text x="60"   y="100">INPUT</text>
    <text x="260"  y="100">REASON</text>
    <text x="510"  y="100">TOOLBELT</text>
    <text x="780"  y="100">EVAL</text>
    <text x="980"  y="100">STREAM</text>
  </g>

  <style>
    .node { fill: #f4f1ea; stroke: #111; stroke-width: 3; }
    .node-hot { fill: #ff5b1f; stroke: #111; stroke-width: 3; }
    .node-ink { fill: #111; stroke: #111; stroke-width: 3; }
    .node-warn { fill: #ffd23f; stroke: #111; stroke-width: 3; }
    .ttl { font: 800 13px 'Archivo Black', sans-serif; letter-spacing: 0.5px; fill: #111; }
    .ttl-d { font: 800 13px 'Archivo Black', sans-serif; letter-spacing: 0.5px; fill: #f4f1ea; }
    .sub { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 1px; fill: #111; }
    .sub-d { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 1px; fill: #f4f1ea; }
    .icon { font: 800 22px 'Archivo Black', sans-serif; }
  </style>

  <!-- 1 INPUT (FastAPI) -->
  <g transform="translate(40,130)">
    <rect class="node-ink" width="170" height="120"/>
    <text class="icon" x="14" y="34" fill="#f4f1ea">▣</text>
    <text class="ttl-d" x="14" y="64">FASTAPI</text>
    <text class="ttl-d" x="14" y="80">QUESTION</text>
    <text class="sub-d" x="14" y="100">POST /ask</text>
    <text class="sub-d" x="14" y="116">→ stream_id</text>
  </g>

  <!-- 2 PLAN (LangGraph node) -->
  <g transform="translate(240,130)">
    <rect class="node-hot" width="190" height="120"/>
    <text class="icon" x="14" y="34" fill="#111">◆</text>
    <text class="ttl" x="14" y="64">PLAN</text>
    <text class="ttl" x="14" y="80">LangGraph</text>
    <text class="sub" x="14" y="100">2–5 sub-qs</text>
    <text class="sub" x="14" y="116">pick tools</text>
  </g>

  <!-- 3 RETRIEVE -->
  <g transform="translate(240,280)">
    <rect class="node-hot" width="190" height="120"/>
    <text class="icon" x="14" y="34" fill="#111">⤵</text>
    <text class="ttl" x="14" y="64">RETRIEVE</text>
    <text class="ttl" x="14" y="80">parallel fan-out</text>
    <text class="sub" x="14" y="100">dense + sparse</text>
    <text class="sub" x="14" y="116">→ top-k 24</text>
  </g>

  <!-- 4 TOOLBELT (4 tools stacked) -->
  <g transform="translate(470,130)">
    <rect class="node" width="240" height="270"/>
    <text class="icon" x="14" y="34">⚙</text>
    <text class="ttl" x="14" y="64">TOOLBELT</text>
    <line x1="14" y1="80" x2="226" y2="80" stroke="#111" stroke-width="2"/>

    <g transform="translate(14,92)">
      <rect class="node-warn" width="210" height="40"/>
      <text class="ttl" x="10" y="26" font-size="12">QDRANT</text>
      <text class="sub" x="100" y="26">vector · 3.2k docs</text>
    </g>
    <g transform="translate(14,140)">
      <rect class="node-warn" width="210" height="40"/>
      <text class="ttl" x="10" y="26" font-size="12">BM25</text>
      <text class="sub" x="100" y="26">keyword · sparse</text>
    </g>
    <g transform="translate(14,188)">
      <rect class="node" width="210" height="40"/>
      <text class="ttl" x="10" y="26" font-size="12">TAVILY</text>
      <text class="sub" x="100" y="26">web search</text>
    </g>
    <g transform="translate(14,236)">
      <rect class="node" width="210" height="40"/>
      <text class="ttl" x="10" y="26" font-size="12">CALC</text>
      <text class="sub" x="100" y="26">python sandbox</text>
    </g>
  </g>

  <!-- 5 EVALUATE -->
  <g transform="translate(750,200)">
    <rect class="node-hot" width="170" height="130"/>
    <text class="icon" x="14" y="34" fill="#111">✓</text>
    <text class="ttl" x="14" y="64">EVALUATE</text>
    <text class="ttl" x="14" y="80">score chunks</text>
    <text class="sub" x="14" y="100">coverage ≥ θ ?</text>
    <text class="sub" x="14" y="116">retries ≤ 2</text>
  </g>

  <!-- 6 ANSWER + STREAM -->
  <g transform="translate(950,200)">
    <rect class="node-hot" width="210" height="130"/>
    <text class="icon" x="14" y="34" fill="#111">→</text>
    <text class="ttl" x="14" y="64">ANSWER</text>
    <text class="ttl" x="14" y="80">+ STREAM</text>
    <text class="sub" x="14" y="100">SSE · p95 2.8s</text>
    <text class="sub" x="14" y="116">citations [id#n]</text>
  </g>

  <!-- 7 NEXT.JS UI -->
  <g transform="translate(950,360)">
    <rect class="node" width="210" height="100"/>
    <text class="icon" x="14" y="34">◫</text>
    <text class="ttl" x="14" y="64">NEXT.JS UI</text>
    <text class="ttl" x="14" y="80">live thinking trace</text>
    <text class="sub" x="14" y="98">+ sources panel</text>
  </g>

  <!-- 8 LANGSMITH / LOGS -->
  <g transform="translate(40,400)">
    <rect class="node-ink" width="170" height="90"/>
    <text class="icon" x="14" y="34" fill="#f4f1ea">⌗</text>
    <text class="ttl-d" x="14" y="64">LANGSMITH</text>
    <text class="ttl-d" x="14" y="80">+ POSTGRES</text>
  </g>

  <!-- ============ WIRES ============ -->
  <g fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arr)">
    <!-- input -> plan -->
    <path d="M210,190 L240,190"/>
    <!-- plan -> retrieve -->
    <path d="M335,250 L335,280"/>
    <!-- retrieve -> toolbelt -->
    <path d="M430,340 L470,340" stroke-dasharray="6 4"/>
    <!-- toolbelt -> evaluate (merge) -->
    <path d="M710,265 L750,265" stroke-dasharray="6 4"/>
    <!-- evaluate -> answer -->
    <path d="M920,265 L950,265"/>
    <!-- answer -> ui -->
    <path d="M1055,330 L1055,360"/>
  </g>

  <!-- orange self-correction loop -->
  <g fill="none" stroke="#ff5b1f" stroke-width="3" marker-end="url(#arrO)">
    <path d="M835,200 C 835,90 470,90 425,130"/>
    <text x="600" y="78" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff5b1f" letter-spacing="1.5">RE-PLAN  if coverage &lt; θ  (max 2)</text>
  </g>

  <!-- logging wire (grey) -->
  <g fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6">
    <path d="M335,400 L335,400 M125,400 L125,400"/>
    <path d="M425,445 C 300,445 200,445 210,445"/>
    <path d="M835,330 C 700,420 250,420 210,445"/>
  </g>

  <!-- footer / legend -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#111" letter-spacing="1.5">
    <rect x="20" y="500" width="1160" height="28" fill="none" stroke="#111" stroke-width="2"/>
    <text x="36" y="519">[■] GRAPH NODE</text>
    <text x="200" y="519">[■] HOT PATH</text>
    <text x="360" y="519">[■] TOOL</text>
    <text x="480" y="519">[■] SELF-CORRECT</text>
    <text x="1160" y="519" text-anchor="end">EVAL 0.91  ·  STREAM 2.8s  ·  RETRIES ≤ 2  ·  TOKENS/RUN CAP</text>
  </g>
</svg>

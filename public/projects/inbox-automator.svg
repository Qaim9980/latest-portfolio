<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Inbox Automator — n8n workflow diagram">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111" stroke-width="0.5" opacity="0.18"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="540" fill="#f4f1ea"/>
  <rect width="1200" height="540" fill="url(#grid)"/>
  <rect x="6" y="6" width="1188" height="528" fill="none" stroke="#111" stroke-width="3"/>

  <!-- title bar -->
  <g font-family="'JetBrains Mono', monospace" font-weight="700">
    <rect x="20" y="20" width="1160" height="46" fill="#111"/>
    <text x="36" y="51" font-size="16" fill="#f4f1ea" letter-spacing="2">n8n  //  INBOX-AUTOMATOR  //  WORKFLOW  v1.0  //  STATUS: ● LIVE</text>
    <text x="1160" y="51" font-size="12" fill="#ff5b1f" text-anchor="end" letter-spacing="1.5">EXEC 00:00:12s</text>
  </g>

  <!-- column labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#111" letter-spacing="1.5">
    <text x="60"  y="100">INGEST</text>
    <text x="280" y="100">UNDERSTAND</text>
    <text x="540" y="100">DECIDE</text>
    <text x="820" y="100">ACT</text>
    <text x="1040" y="100">OBSERVE</text>
  </g>

  <!-- ============ NODES ============ -->
  <style>
    .node { fill: #f4f1ea; stroke: #111; stroke-width: 3; }
    .node-hot { fill: #ff5b1f; stroke: #111; stroke-width: 3; }
    .node-ink { fill: #111; stroke: #111; stroke-width: 3; }
    .node-warn { fill: #ffd23f; stroke: #111; stroke-width: 3; }
    .ttl { font: 800 13px 'Archivo Black', sans-serif; letter-spacing: 0.5px; fill: #111; }
    .ttl-d { font: 800 13px 'Archivo Black', sans-serif; letter-spacing: 0.5px; fill: #f4f1ea; }
    .sub { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 1px; fill: #111; }
    .sub-d { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 1px; fill: #f4f1ea; }
    .icon { font: 800 22px 'Archivo Black', sans-serif; }
  </style>

  <!-- 1 GMAIL TRIGGER -->
  <g transform="translate(40,130)">
    <rect class="node" width="160" height="110"/>
    <text class="icon" x="14" y="34">@</text>
    <text class="ttl" x="14" y="64">GMAIL</text>
    <text class="ttl" x="14" y="80">TRIGGER</text>
    <text class="sub" x="14" y="100">POLL: 30s</text>
  </g>

  <!-- 2 NORMALIZE -->
  <g transform="translate(260,130)">
    <rect class="node" width="160" height="110"/>
    <text class="icon" x="14" y="34">≡</text>
    <text class="ttl" x="14" y="64">NORMALIZE</text>
    <text class="ttl" x="14" y="80">&amp; CLEAN</text>
    <text class="sub" x="14" y="100">STRIP QUOTES</text>
  </g>

  <!-- 3 REDIS CACHE -->
  <g transform="translate(260,290)">
    <rect class="node-warn" width="160" height="100"/>
    <text class="icon" x="14" y="34" fill="#111">[R]</text>
    <text class="ttl" x="14" y="64">REDIS</text>
    <text class="ttl" x="14" y="80">THREAD CACHE</text>
    <text class="sub" x="14" y="90">TTL 24h</text>
  </g>

  <!-- 4 OPENAI -->
  <g transform="translate(500,210)">
    <rect class="node-hot" width="200" height="140"/>
    <text class="icon" x="14" y="34" fill="#111">✦</text>
    <text class="ttl" x="14" y="64">OPENAI</text>
    <text class="ttl" x="14" y="80">CLASSIFY</text>
    <text class="sub" x="14" y="100">gpt-4o-mini</text>
    <text class="sub" x="14" y="116">JSON SCHEMA</text>
    <text class="sub" x="14" y="132">→ {intent, conf, draft}</text>
  </g>

  <!-- 5 SWITCH -->
  <g transform="translate(780,130)">
    <rect class="node" width="160" height="320"/>
    <text class="icon" x="14" y="34">⇆</text>
    <text class="ttl" x="14" y="64">CONFIDENCE</text>
    <text class="ttl" x="14" y="80">SWITCH</text>
    <line x1="14" y1="100" x2="146" y2="100" stroke="#111" stroke-width="2"/>
    <text class="sub" x="14" y="120">≥ 0.85  AUTO</text>
    <text class="sub" x="14" y="180">0.6–0.85  HITL</text>
    <text class="sub" x="14" y="240">&lt; 0.6   ESCALATE</text>
  </g>

  <!-- 6 CRM -->
  <g transform="translate(990,40)">
    <rect class="node" width="170" height="90"/>
    <text class="icon" x="14" y="34">▤</text>
    <text class="ttl" x="14" y="64">CRM</text>
    <text class="ttl" x="14" y="80">UPDATE</text>
  </g>

  <!-- 7 SLACK -->
  <g transform="translate(990,160)">
    <rect class="node" width="170" height="90"/>
    <text class="icon" x="14" y="34">#</text>
    <text class="ttl" x="14" y="64">SLACK</text>
    <text class="ttl" x="14" y="80">NOTIFY</text>
  </g>

  <!-- 8 HITL REVIEW -->
  <g transform="translate(990,280)">
    <rect class="node-warn" width="170" height="90"/>
    <text class="icon" x="14" y="34">☑</text>
    <text class="ttl" x="14" y="64">HUMAN</text>
    <text class="ttl" x="14" y="80">IN-THE-LOOP</text>
  </g>

  <!-- 9 POSTGRES AUDIT -->
  <g transform="translate(40,400)">
    <rect class="node-ink" width="200" height="90"/>
    <text class="icon" x="14" y="34" fill="#f4f1ea">⌗</text>
    <text class="ttl-d" x="14" y="64">POSTGRES</text>
    <text class="ttl-d" x="14" y="80">AUDIT + DLQ</text>
  </g>

  <!-- 10 ERROR WORKFLOW -->
  <g transform="translate(280,400)">
    <rect class="node" width="200" height="90"/>
    <text class="icon" x="14" y="34">!</text>
    <text class="ttl" x="14" y="64">ERROR</text>
    <text class="ttl" x="14" y="80">WORKFLOW</text>
  </g>

  <!-- ============ WIRES ============ -->
  <g fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arr)">
    <!-- gmail -> normalize -->
    <path d="M200,185 L260,185"/>
    <!-- normalize -> redis (down) -->
    <path d="M340,240 L340,290"/>
    <!-- normalize -> openai (down-right) -->
    <path d="M420,210 L500,260"/>
    <!-- openai -> switch -->
    <path d="M700,280 L780,280"/>
    <!-- redis -> openai -->
    <path d="M420,340 L500,320"/>
    <!-- switch -> crm (up) -->
    <path d="M940,170 C 970,150 970,100 990,85"/>
    <!-- switch -> slack -->
    <path d="M940,205 L990,205"/>
    <!-- switch -> hitl (down) -->
    <path d="M940,330 L990,325"/>
    <!-- openai -> postgres (down-left long) -->
    <path d="M540,350 C 540,420 240,420 240,445"/>
    <!-- postgres -> error -->
    <path d="M240,445 L280,445"/>
    <!-- error -> slack (back to start) -->
    <path d="M480,420 C 700,420 1000,420 1000,420" />
  </g>

  <!-- footer / legend -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#111" letter-spacing="1.5">
    <rect x="20" y="500" width="1160" height="28" fill="none" stroke="#111" stroke-width="2"/>
    <text x="36" y="519">[■] NODE</text>
    <text x="160" y="519">[■] HOT PATH</text>
    <text x="300" y="519">[■] HUMAN-LOOP</text>
    <text x="460" y="519">[■] STATE / DB</text>
    <text x="1160" y="519" text-anchor="end">RTO &lt; 30s  ·  DLQ: ON  ·  REDIS TTL: 24h</text>
  </g>
</svg>
